# 仅供 go test 用的一次性测试库；每例测试自己建库、跑迁移、用完销毁。部署编排见上一级目录。
# 端口只绑本机，测试与 make dev-server 的连接串都写 127.0.0.1。
name: wmesh-global-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wmesh
      POSTGRES_PASSWORD: wmesh
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmesh"]
      interval: 2s
      timeout: 5s
      retries: 20
