name: wmesh-${WMESH_SIDE:-global}

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.app
      args:
        SIDE: ${WMESH_SIDE:-global}
    environment:
      WMESH_DSN: postgres://wmesh:wmesh@db:5432/${WMESH_DB_NAME:-wmesh}?sslmode=disable
      WMESH_HTTP_ADDR: ":8080"
      WMESH_BOOTSTRAP_TOKEN: ${WMESH_BOOTSTRAP_TOKEN:-wmesh-dev-bootstrap}
      WMESH_FACTORY_BOOTSTRAP_URL: ${WMESH_FACTORY_BOOTSTRAP_URL:-http://host.docker.internal:8081}
      WMESH_ADMIN_LOGIN: ${WMESH_ADMIN_LOGIN:-wan}
      WMESH_ADMIN_PASSWORD: ${WMESH_ADMIN_PASSWORD:-wan-dev-pass}
    ports:
      - "${HTTP_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      oss:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    build:
      context: .
      dockerfile: deploy/Dockerfile.db
    environment:
      POSTGRES_USER: wmesh
      POSTGRES_PASSWORD: wmesh
      POSTGRES_DB: ${WMESH_DB_NAME:-wmesh}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmesh"]
      interval: 2s
      timeout: 5s
      retries: 20

  oss:
    build:
      context: .
      dockerfile: deploy/Dockerfile.oss
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wmeshoss}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wmeshoss}
      WMESH_OSS_BUCKET: ${WMESH_OSS_BUCKET:-wmesh}
    volumes:
      - oss-data:/data
    ports:
      - "${OSS_PORT:-9000}:9000"
      - "${OSS_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/oss-health.sh"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
  oss-data:
